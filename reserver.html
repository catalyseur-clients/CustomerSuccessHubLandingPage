<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réserver une démo — Catalyseur Clients</title>
  <meta name="description" content="Réservez votre démo de 20 minutes de Customer Success Hub.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://assets.calendly.com" crossorigin>
  <link rel="dns-prefetch" href="https://assets.calendly.com">
  <link rel="icon" href="/favicon.ico">
  <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">

  <!-- Consentement cookies + Meta Pixel -->
  <script src="/consent.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f1a;
      --bg-card: #141827;
      --primary: #22c9a8;
      --text: #e8edf5;
      --text-muted: #8892a8;
      --border: rgba(255,255,255,0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container { max-width: 880px; margin: 0 auto; padding: 0 24px; width: 100%; }

    nav { border-bottom: 1px solid var(--border); }
    nav .container { display: flex; align-items: center; padding: 14px 24px; max-width: 1120px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; text-decoration: none; color: var(--text); }
    .logo-mark { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo-mark svg { width: 18px; height: 18px; }

    main { flex: 1; padding: 48px 0 64px; }

    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 10px; }
    h1 span { color: var(--primary); }
    .subtitle { color: var(--text-muted); margin-bottom: 28px; max-width: 620px; }

    #calendly-embed {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      min-height: 700px;
    }
    #calendly-embed iframe { width: 100% !important; }

    footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; font-size: 0.8rem; color: var(--text-muted); }
    footer a { color: var(--text-muted); }
  </style>
</head>
<body>

  <nav>
    <div class="container">
      <a href="/" class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l4 4l-4 4l2 6l-2-2l6 2l-6-2l2-4l-2 2l4 4l-8 0l4-4" stroke="#0d0f1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        Catalyseur Clients
      </a>
    </div>
  </nav>

  <main>
    <div class="container">
      <h1>Réservez votre <span>démo</span></h1>
      <p class="subtitle">Choisissez un créneau de 20 minutes. Vous recevrez l'invitation et le lien de visioconférence par email.</p>
      <div id="calendly-embed"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Catalyseur Clients - Customer Success Hub &copy; 2026 &middot; <a href="#" onclick="window.ccOpen && window.ccOpen(); return false;">Gérer les cookies</a></p>
    </div>
  </footer>

  <script src="https://assets.calendly.com/assets/external/widget.js"></script>
  <script>
    Calendly.initInlineWidget({
      url: 'https://calendly.com/claire_le_gall/demo-customer-success-hub',
      parentElement: document.getElementById('calendly-embed'),
      resize: true
    });

    // Redirection vers la page de confirmation une fois la réservation finalisée
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://calendly.com' || !e.data) return;
      if (e.data.event === 'calendly.event_scheduled') {
        window.location.href = '/confirmation.html';
      }
    });
  </script>

</body>
</html>
